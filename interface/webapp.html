<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit&amp;Rust Store</title>
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./src/css/style.css">
</head>

<body>
    <nav class="navbar fixed-top app-navbar">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <button class="navbar-toggler border-0 icon-button" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sidebar" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <a class="navbar-brand m-0 fw-bold d-flex align-items-center" href="./index.html">
                <i class="bi bi-grid-3x3-gap-fill me-2"></i>Bit&amp;Rust
            </a>

            <div class="d-flex align-items-center gap-2">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>
                <a class="btn btn-primary app-action-btn fw-bold" href="./index.html">
                    <i class="bi bi-house-fill me-2"></i>Menu Home
                </a>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold text-primary">Menu Principal</h5>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <ul class="navbar-nav flex-grow-1">
                <li class="nav-item"><a class="nav-link active" href="./webapp.html"><i class="bi bi-house-door me-2"></i>Web app</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="./index.html"><i class="bi bi-controller me-2"></i>Meus Jogos</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="./users.html"><i class="bi bi-people me-2"></i>Usuários</a></li>
            </ul>

            <div class="sidebar-utility-actions">
                <a class="nav-link sidebar-settings-link" href="./settings.html">
                    <i class="bi bi-gear"></i>
                    <span>Configurações</span>
                </a>
            </div>

            <div class="user-section mt-auto">
                <div class="dropup">
                    <a href="#" class="user-link d-flex align-items-center text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown">
                        <div class="position-relative me-3">
                            <img src="./src/img/perfil/avatargamer0.jpg" alt="User" class="user-avatar rounded-circle">
                            <span
                                class="position-absolute bottom-0 start-100 translate-middle p-2 bg-success border border-white rounded-circle"></span>
                        </div>
                        <div class="d-flex flex-column">
                            <strong class="lh-1 text-primary">Bit&Rust</strong>
                        </div>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-start shadow mb-3 border-0 rounded-4">
                        <li><a class="dropdown-item py-2" href="#"><i class="bi bi-person me-2"></i>Perfil</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item text-danger py-2" href="#" id="exitLauncher">Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <main class="container-fluid px-4 py-4 store-page">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4" id="storeGrid">
            <div class="col store-item">
                <article class="store-card h-100" data-title="YouTube" data-url="https://www.youtube.com/" data-open-mode="launcher">
                    <div class="store-web-thumb store-web-youtube">
                        <i class="bi bi-youtube"></i>
                    </div>
                    <div class="store-card-body">
                        <h3>YouTube</h3>
                        <p>Vídeos, música, canais e transmissões ao vivo.</p>
                        <button class="btn btn-primary w-100" data-title="YouTube" data-url="https://www.youtube.com/" data-open-mode="launcher">
                            <i class="bi bi-box-arrow-up-right me-2"></i>Acessar
                        </button>
                    </div>
                </article>
            </div>

            <div class="col store-item">
                <article class="store-card h-100" data-title="Google" data-url="https://www.google.com/webhp?igu=1" data-open-mode="launcher">
                    <div class="store-web-thumb store-web-google">
                        <i class="bi bi-google"></i>
                    </div>
                    <div class="store-card-body">
                        <h3>Google</h3>
                        <p>Pesquisa, sites, imagens e outros serviços web.</p>
                        <button class="btn btn-primary w-100" data-title="Google" data-url="https://www.google.com/webhp?igu=1" data-open-mode="launcher">
                            <i class="bi bi-box-arrow-up-right me-2"></i>Acessar
                        </button>
                    </div>
                </article>
            </div>

            <div class="col store-item">
                <article class="store-card h-100" data-title="Discord" data-url="https://discord.com/app" data-open-mode="native-launcher">
                    <div class="store-web-thumb store-web-discord">
                        <i class="bi bi-discord"></i>
                    </div>
                    <div class="store-card-body">
                        <h3>Discord</h3>
                        <p>Comunidades, chamadas, mensagens e canais.</p>
                        <button class="btn btn-primary w-100" data-title="Discord" data-url="https://discord.com/app" data-open-mode="native-launcher">
                            <i class="bi bi-box-arrow-up-right me-2"></i>Acessar
                        </button>
                    </div>
                </article>
            </div>
        </div>

        <section class="launcher-browser d-none" id="launcherBrowser">
            <div class="launcher-browser-stage" id="browserStage">
                <webview id="browserFrame" title="Navegador do launcher" allowpopups allowfullscreen
                    style="display: flex; width: 100%; height: 100%; min-height: 100%;"></webview>
                <div class="virtual-browser-cursor" id="browserCursor" aria-hidden="true"></div>
            </div>
            <div class="browser-virtual-keyboard d-none" id="browserVirtualKeyboard"></div>
        </section>
    </main>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./src/js/modal-alert.js"></script>
    <script src="./src/js/store.js"></script>
</body>

</html>
