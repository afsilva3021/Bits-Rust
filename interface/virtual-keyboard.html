<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teclado virtual</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #111827;
            --surface: #1f2937;
            --surface-strong: #273449;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.26);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--text);
            background: rgba(15, 23, 42, 0.96);
            overflow: hidden;
        }

        .keyboard-modal {
            width: 100%;
            height: 100%;
            padding: 14px;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 10px;
            background: linear-gradient(180deg, rgba(31, 41, 55, 0.98), rgba(15, 23, 42, 0.98));
            border: 1px solid var(--border);
        }

        .keyboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 900;
            white-space: nowrap;
        }

        .keyboard-hint {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-align: right;
        }

        .keyboard {
            display: grid;
            align-content: stretch;
            gap: 7px;
            min-height: 0;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            min-width: 0;
        }

        .key {
            flex: 0 1 54px;
            min-width: 0;
            min-height: 42px;
            padding: 0 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 17px;
            font-weight: 900;
            line-height: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .key.wide {
            flex-basis: 112px;
            font-size: 14px;
        }

        .key.selected {
            color: #06121f;
            background: var(--accent);
            border-color: #7dd3fc;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.28);
        }

        @media (max-width: 760px) {
            .keyboard-modal {
                padding: 10px;
                gap: 7px;
            }

            .keyboard-header {
                gap: 8px;
            }

            h1 {
                font-size: 15px;
            }

            .keyboard-hint {
                font-size: 10px;
            }

            .keyboard {
                gap: 5px;
            }

            .keyboard-row {
                gap: 4px;
            }

            .key {
                flex-basis: 34px;
                min-height: 34px;
                padding: 0 5px;
                font-size: 13px;
                border-radius: 6px;
            }

            .key.wide {
                flex-basis: 72px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <main class="keyboard-modal">
        <div class="keyboard-header">
            <h1>Teclado virtual</h1>
            <div class="keyboard-hint">A seleciona | B/X fecha | Y apaga | LB/RB maiuscula | LT/RT cursor</div>
        </div>
        <div class="keyboard" id="keyboard"></div>
    </main>

    <script>
        const keyboard = document.getElementById('keyboard');

        window.updateKeyboardState = function updateKeyboardState(state) {
            state = state || {};
            keyboard.innerHTML = '';

            (state.rows || []).forEach((row) => {
                const rowElement = document.createElement('div');
                rowElement.className = 'keyboard-row';

                row.forEach((key) => {
                    const item = document.createElement('div');
                    item.className = `key${key.wide ? ' wide' : ''}${key.selected ? ' selected' : ''}`;
                    item.textContent = key.label;
                    rowElement.appendChild(item);
                });

                keyboard.appendChild(rowElement);
            });
        };
    </script>
</body>

</html>
